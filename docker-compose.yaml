services:
  container:
#    build: .
    image: ${IMAGE:-ghcr.io/pokedo0/llmcord:latest}
    pull_policy: always
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./config:/app/config

  aistudio2api:
    image: ghcr.io/mag1cfall/aistudio2api:latest
    pull_policy: always
    restart: unless-stopped
    init: true
    ports:
      - "2048:2048"
    environment:
      - ADMIN_AUTH_ENABLED=true
      - ADMIN_USERNAME=${AISTUDIO_ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${AISTUDIO_ADMIN_PASSWORD}
      - PROXY_API_KEY=${AISTUDIO_PROXY_API_KEY}
      - TEMPORARY_CHAT=${TEMPORARY_CHAT:-true}
    volumes:
      - aistudio-data:/data

  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 86400 --cleanup

volumes:
  aistudio-data:
    name: llmcord_aistudio-data

